version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: configs
      ref: v1.2.1
      uri: https://github.com/trunk-io/configs
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - prettier
    - pylint
  enabled:
    - gitleaks@8.30.1
    - ty@0.0.89
    - pre-commit-hooks@5.0.0
    - trivy@0.76.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - checkov@3.3.29
    - git-diff-check
    - hadolint@2.15.1
    - markdownlint@0.49.1
    - oxipng@10.2.1
    - renovate@44.164.10
    - ruff@0.17.1
    - trufflehog@3.99.2
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-check-pre-push-always
    - trunk-check-pre-commit
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
