#:schema https://mise.jdx.dev/schema/mise.json

[settings]
lockfile = true

[tools]
node = "lts"

[tasks.dev]
description = "Start the Astro dev server"
run = "npm run dev"

[tasks.build]
description = "Build the site to dist/"
run = "npm run build"

[tasks.preview]
description = "Serve the built site"
run = "npm run preview"

[tasks.check]
description = "Type-check every Astro file"
run = "npm run check"

[tasks.format]
description = "Format the project with Oxfmt"
run = "npm run format"

[tasks.lint]
description = "Lint the project with Oxlint"
run = "npm run lint"

[tasks.test]
description = "Run the test suite"
run = "npm test"
